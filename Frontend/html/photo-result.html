<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>사진 분석 결과 | AI 건설현장 안전관리 시스템</title>

<script src="../js/common/accessibility.js"></script>
<script src="../js/common/user-prefs.js"></script>
<script src="../js/common/i18n/lang-ko.js"></script>
<script src="../js/common/i18n/lang-en.js"></script>
<script src="../js/common/i18n/lang-zh.js"></script>
<script src="../js/common/i18n/lang-vi.js"></script>
<script src="../js/common/i18n/lang-th.js"></script>
<script src="../js/common/i18n/lang-id.js"></script>
<script src="../js/common/i18n/lang-ne.js"></script>
<script src="../js/common/i18n/lang-ja.js"></script>
<script src="../js/common/i18n/status-labels.js"></script>
<script src="../js/common/i18n.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FE0">
<link rel="apple-touch-icon" href="../../pictures/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/accessibility.css">
</head>
<body>

<div class="app-frame" data-has-nav="true">

  <header class="app-header app-header--back">
    <a href="dashboard.html" class="back-btn" aria-label="뒤로가기">&#8249;</a>
    <div class="app-header__title">사진 분석 결과 <span class="mock-tag" id="photo-mock-tag" style="display:none;">MOCK</span></div>
    <div class="app-header__actions">
      <span class="app-header__icon-btn" id="download-btn" aria-label="다운로드">⬇️</span>
      <span class="app-header__icon-btn" id="share-btn" aria-label="공유">🔗</span>
    </div>
  </header>

  <div class="app-content">

    <div class="photo-result-image" id="photo-result-image">
      <!-- JS가 img + 박스 오버레이를 채웁니다 -->
    </div>

    <div class="photo-score-card">
      <div>
        <div style="font-size: var(--fs-xs); opacity:0.9;">사진 위험도 점수</div>
        <div class="photo-score-card__number" id="score-number">--</div>
        <span class="photo-score-card__badge" id="score-badge">--</span>
      </div>
      <div class="photo-score-card__count">
        <div class="photo-score-card__count-num" id="hazard-count">-</div>
        <div class="photo-score-card__count-label">탐지된 위험요소</div>
      </div>
    </div>

    <section class="card" style="margin-bottom: var(--space-md);">
      <h2 class="card-section-title">탐지된 위험요소</h2>
      <div id="hazard-list"></div>
    </section>

    <div class="result-actions">
      <a href="photo-capture.html" class="btn btn-outline">🔄 다시 촬영하기</a>
      <button type="button" class="btn btn-primary" id="save-btn">💾 결과 저장하기</button>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav__item" data-i18n="nav.dashboard">대시보드</a>
    <a href="predict-input.html" class="bottom-nav__item" data-i18n="nav.predict">위험도 분석</a>
    <a href="photo-capture.html" class="bottom-nav__item is-active" data-i18n="nav.photo">사진 분석</a>
    <a href="similar-cases.html" class="bottom-nav__item" data-i18n="nav.cases">사례 검색</a>
    <a href="profile.html" class="bottom-nav__item" data-i18n="nav.profile">내 정보</a>
  </nav>

</div>

<script src="../js/common/session-store.js"></script>
<script src="../js/pages/photo-result.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
