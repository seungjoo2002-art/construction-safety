<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>현장 정보 입력 | AI 건설현장 안전관리 시스템</title>

<script src="../js/common/accessibility.js"></script>
<script src="../js/common/user-prefs.js"></script>
<script src="../js/common/i18n/lang-ko.js"></script>
<script src="../js/common/i18n/lang-en.js"></script>
<script src="../js/common/i18n/lang-zh.js"></script>
<script src="../js/common/i18n/lang-vi.js"></script>
<script src="../js/common/i18n/lang-th.js"></script>
<script src="../js/common/i18n/lang-id.js"></script>
<script src="../js/common/i18n/lang-ne.js"></script>
<script src="../js/common/i18n/status-labels.js"></script>
<script src="../js/common/i18n.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FE0">
<link rel="apple-touch-icon" href="../../pictures/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/accessibility.css">
</head>
<body>

<div class="app-frame" data-has-nav="false">

  <header class="site-setup-header">
    <img src="../../pictures/logo.png" alt="로고" class="site-setup-header__logo">
    <h1 class="site-setup-header__title" data-i18n="siteSetup.title">현장 정보 입력</h1>
    <p class="site-setup-header__desc" data-i18n="siteSetup.desc">시작 전 현장 기본 정보를 입력해주세요</p>
    <div class="stepper-dots" id="stepper-dots"></div>
  </header>

  <div class="app-content">
    <form id="site-setup-form" novalidate>

      <!-- STEP 1 — 공사 기간 -->
      <section class="wizard-step" data-step="1">
        <h2 class="wizard-step__title" data-i18n="siteSetup.step1Title">공사 기간</h2>

        <div class="form-group">
          <label class="form-group__label" for="field-start-date">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
            <span data-i18n="siteSetup.startDateLabel">공사 시작일</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.startDateDesc">D-day 산정 기준일</p>
          <div class="input-field">
            <input type="date" id="field-start-date" name="공사시작일" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="field-end-date">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
            <span data-i18n="siteSetup.endDateLabel">공사 종료일</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.endDateDesc">준공 예정일</p>
          <div class="input-field">
            <input type="date" id="field-end-date" name="공사종료일" required>
          </div>
          <p id="date-error" class="field-error" style="display:none; color: var(--color-danger); font-size: var(--fs-xs); margin-top: 6px;"></p>
        </div>
      </section>

      <!-- STEP 2 — 발주·시설물 정보 -->
      <section class="wizard-step" data-step="2" hidden>
        <h2 class="wizard-step__title" data-i18n="siteSetup.step2Title">발주 · 시설물 정보</h2>

        <div class="form-group">
          <label class="form-group__label">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
            </span>
            <span data-i18n="siteSetup.publicPrivateLabel">공사 구분</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.publicPrivateDesc">발주 유형을 선택해주세요</p>
          <div class="button-select" data-cols="2" data-field="공공/민간 구분" id="field-public-private"></div>
        </div>

        <div class="form-group">
          <label class="form-group__label">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg>
            </span>
            <span data-i18n="siteSetup.facilityMajorLabel">시설물 종류 - 대분류</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.facilityMajorDesc">해당하는 분류를 선택해주세요</p>
          <div class="button-select" data-cols="4" data-field="시설물 종류 - 대분류" id="field-facility-major"></div>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="field-facility-minor">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            </span>
            <span data-i18n="siteSetup.facilityMinorLabel">시설물 종류 - 중분류</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.facilityMinorDesc">세부 시설물 종류를 선택해주세요</p>
          <div class="select-field">
            <select id="field-facility-minor" name="시설물 종류 - 중분류" required>
              <option value="" disabled selected data-i18n="siteSetup.selectPlaceholder">선택하세요</option>
            </select>
          </div>
        </div>
      </section>

      <!-- STEP 3 — 안전 계획 확인 -->
      <section class="wizard-step" data-step="3" hidden>
        <h2 class="wizard-step__title" data-i18n="siteSetup.step3Title">안전 계획 확인</h2>

        <div class="form-group">
          <label class="form-group__label">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </span>
            <span data-i18n="siteSetup.safetyPlanLabel">안전관리계획</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.safetyPlanDesc">산업안전보건법에 따른 안전관리계획 수립 여부</p>
          <div class="button-select" data-cols="1" data-field="안전관리계획" id="field-safety-plan"></div>
        </div>

        <div class="form-group">
          <label class="form-group__label">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
            </span>
            <span data-i18n="siteSetup.designSafetyLabel">설계안전성검토</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.designSafetyDesc">설계안전성검토(DFS) 대상 여부</p>
          <div class="button-select" data-cols="2" data-field="설계안전성검토" id="field-design-safety"></div>
        </div>
      </section>

      <!-- STEP 4 — 현장 규모 및 담당자 정보 -->
      <section class="wizard-step" data-step="4" hidden>
        <h2 class="wizard-step__title" data-i18n="siteSetup.step4Title">현장 규모 및 담당자 정보</h2>

        <div class="form-group">
          <label class="form-group__label" for="field-worker-count">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <span data-i18n="siteSetup.workerCountLabel">작업자수</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.workerCountDesc">현장 상시 투입 인원 규모</p>
          <div class="select-field">
            <select id="field-worker-count" name="작업자수" required>
              <option value="" disabled selected data-i18n="siteSetup.selectPlaceholder">선택하세요</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="field-bid-rate">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            </span>
            <span data-i18n="siteSetup.bidRateLabel">낙찰률</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.bidRateDesc">계약 낙찰률 구간</p>
          <div class="select-field">
            <select id="field-bid-rate" name="낙찰률" required>
              <option value="" disabled selected data-i18n="siteSetup.selectPlaceholder">선택하세요</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="field-cost">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2v16"/></svg>
            </span>
            <span data-i18n="siteSetup.costLabel">공사비</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.costDesc">총 공사금액 구간</p>
          <div class="select-field">
            <select id="field-cost" name="공사비" required>
              <option value="" disabled selected data-i18n="siteSetup.selectPlaceholder">선택하세요</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-group__label">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span data-i18n="siteSetup.ageGroupLabel">본인 연령대</span>
          </label>
          <p class="form-group__desc" data-i18n="siteSetup.ageGroupDesc">안전관리 담당자 본인의 연령대</p>
          <div class="button-select" data-cols="3" data-field="연령_ord" id="field-age-group"></div>
        </div>
      </section>

    </form>
  </div>

  <div class="wizard-footer">
    <button type="button" class="btn btn-outline" id="prev-btn" style="display:none" data-i18n="siteSetup.prevBtn">이전</button>
    <button type="button" class="btn btn-primary btn-block" id="next-btn" disabled data-i18n="siteSetup.fillAllBtn">모든 항목을 입력해주세요</button>
  </div>

</div>

<script src="../js/common/constants.js"></script>
<script src="../js/common/session-store.js"></script>
<script src="../js/pages/site-setup.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
