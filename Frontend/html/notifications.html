<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>알림 | AI 건설현장 안전관리 시스템</title>

<script src="../js/common/accessibility.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FE0">
<link rel="apple-touch-icon" href="../../pictures/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<div class="app-frame" data-has-nav="true">

  <header class="app-header">
    <div class="app-header__title">알림</div>
    <span class="camera-badge" id="unread-badge" style="background: rgba(255,255,255,0.2);">미확인 0</span>
  </header>

  <div class="app-content">

    <div class="notif-hero">
      <div class="notif-hero__date" id="notif-date">-</div>
      <div class="notif-hero__row">
        <div>
          <div class="notif-hero__score" id="notif-score">--/100</div>
          <span class="notif-hero__badge" id="notif-badge">-</span>
        </div>
        <div class="notif-hero__ring">
          <svg viewBox="0 0 100 100">
            <circle class="notif-hero__ring-track" cx="50" cy="50" r="42"></circle>
            <circle class="notif-hero__ring-value" id="notif-ring" cx="50" cy="50" r="42"></circle>
          </svg>
          <div class="notif-hero__ring-center">
            <div class="notif-hero__ring-num" id="notif-ring-num">-</div>
            <div class="notif-hero__ring-label">위험도</div>
          </div>
        </div>
      </div>
      <div class="notif-hero__chips" id="notif-chips"></div>
    </div>

    <h2 class="notif-section-title">최근 알림</h2>
    <div id="notif-list"></div>
    <p class="notif-end-note">— 모든 알림을 확인했습니다 —</p>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav__item">대시보드</a>
    <a href="predict-input.html" class="bottom-nav__item">위험도 분석</a>
    <a href="photo-capture.html" class="bottom-nav__item">사진 분석</a>
    <a href="similar-cases.html" class="bottom-nav__item">사례 검색</a>
    <a href="chatbot.html" class="bottom-nav__item">AI 챗봇</a>
    <a href="notifications.html" class="bottom-nav__item is-active">알림</a>
  </nav>

</div>

<script src="../js/common/constants.js"></script>
<script src="../js/pages/notifications.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
