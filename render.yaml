# Render Blueprint — 프런트엔드 Static Site 전용.
#
# Backend(FastAPI — /api/predict, /api/analyze, /api/analyze-photo)는
# 여기서 관리하지 않습니다. 이 3개는 실제 서버 연산(ML 추론·임베딩 유사도·이미지
# 분석)이 필요해서 Hugging Face Dataset Viewer API로 대체할 수
# 없고, 계속 별도 Render Web Service로 떠 있어야 합니다 — 대시보드에서 기존처럼
# 수동으로 설정(또는 이미 설정되어 있는 상태를 유지)하세요. 자세한 내용은
# README.md의 "무엇이 바뀌지 않았나" 섹션을 참고하세요.
services:
  - type: web
    name: ai-safety-frontend
    env: static
    buildCommand: node scripts/generate-env.js
    staticPublishPath: Frontend
    envVars:
      # 공개 정보입니다(비밀 토큰 아님) — README의 "Hugging Face 데이터셋 준비" 절차로
      # 만든 데이터셋의 repo id를 그대로 넣으세요. 예: your-username/construction-incidents
      - key: HF_DATASET_ID
        sync: false
      - key: HF_DATASET_CONFIG
        value: default
      - key: HF_DATASET_SPLIT
        value: train
      # 이 값도 공개 정보입니다 — 아래 Backend Web Service의 실제 배포 URL(Render가
      # 자동으로 부여하는 https://<서비스명>.onrender.com 형태)을 그대로 넣으세요.
      - key: BACKEND_API_BASE_URL
        sync: false
