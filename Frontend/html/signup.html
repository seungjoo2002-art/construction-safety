<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>회원가입 | AI 건설현장 안전관리 시스템</title>

<script src="../js/common/accessibility.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FE0">
<link rel="apple-touch-icon" href="../../pictures/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<div class="app-frame" data-has-nav="false">

  <!-- 상단 히어로: 로고 + 타이틀 -->
  <section class="login-hero">
    <img src="../../pictures/logo.png" alt="AI 건설현장 안전관리 시스템 로고" class="login-hero__logo">
    <h1 class="login-hero__title">회원가입</h1>
    <p class="login-hero__tagline">데이터와 AI로 만드는 더 안전한 현장</p>
  </section>

  <!-- 회원가입 카드 -->
  <section class="login-card">
    <h2 class="login-card__title">회원가입</h2>
    <p class="login-card__desc">아래 정보를 입력해 계정을 만들어주세요</p>

    <form id="signup-form" novalidate>
      <div class="input-field">
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="signup-username" name="signup-username" placeholder="아이디" autocomplete="username" required>
      </div>

      <div class="input-field">
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="signup-password" name="signup-password" placeholder="비밀번호" autocomplete="new-password" required>
      </div>

      <div class="input-field">
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="signup-password-confirm" name="signup-password-confirm" placeholder="비밀번호 확인" autocomplete="new-password" required>
      </div>

      <div class="input-field">
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="signup-name" name="signup-name" placeholder="이름" autocomplete="name" required>
      </div>

      <div class="input-field">
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="signup-nickname" name="signup-nickname" placeholder="닉네임" autocomplete="nickname" required>
      </div>

      <div class="input-field">
        <input type="date" id="signup-birthdate" name="signup-birthdate" required>
      </div>

      <p class="field-error" id="signup-error" style="display:none; color: var(--color-danger); font-size: var(--fs-xs);"></p>

      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">가입하기</button>
    </form>

    <p class="login-footer">
      이미 계정이 있으신가요? <a href="login.html" class="link-muted">로그인</a>
    </p>

  </section>

</div>

<script src="../js/pages/signup.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
