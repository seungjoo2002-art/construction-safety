<script src="../js/common/i18n/lang-vi.js"></script>
<script src="../js/common/i18n/lang-th.js"></script>
<script src="../js/common/i18n/lang-id.js"></script>

<script src="../js/common/i18n/lang-ja.js"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FE0">

<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>

<div class="app-frame" data-has-nav="true">

  <header class="app-header app-header--back">
    <a href="dashboard.html" class="back-btn" aria-label="뒤로가기" data-i18n-aria-label="header.aria.back">&#8249;</a>
    <div>
      <div class="app-header__title" data-i18n="similarCases.title">유사 사고 사례</div>
    </div>
  </header>

  <div class="app-content">
    <p style="font-size: var(--fs-xs); color: var(--color-text-placeholder); margin-top: -8px; margin-bottom: var(--space-md);">
      <span id="db-total-note" data-i18n="similarCases.loading">불러오는 중...</span> <span class="mock-tag" id="cases-mock-tag" style="display:none;" data-i18n="common.mock">MOCK</span>
      <a href="similar-cases.html" id="analysis-mode-exit" style="display:none; margin-left:6px;" data-i18n="similarCases.viewAllLink">· 전체 사례 검색으로 보기</a>
    </p>

    <div class="case-search" id="case-search-box">
      <span class="case-search__icon">🔍</span>
      <input type="text" id="case-search-input" placeholder="사고 유형, 현장 검색..." data-i18n-placeholder="similarCases.searchPlaceholder">
    </div>

    <div class="filter-chip-row" id="filter-chip-row"></div>

    <p class="case-count" id="case-count"></p>
    <p class="case-filter-note" id="case-filter-note" style="display:none;"></p>

    <div id="case-list"></div>

    <div class="case-pagination" id="case-pagination" style="display:none;">
      <button type="button" id="case-prev" class="btn btn-outline" disabled data-i18n="similarCases.prevPage">← 이전</button>
      <span class="case-pagination__page" id="case-page-indicator">1 페이지</span>
      <button type="button" id="case-next" class="btn btn-outline" data-i18n="similarCases.nextPage">다음 →</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav__item" data-i18n="nav.dashboard">대시보드</a>
    <a href="predict-input.html" class="bottom-nav__item" data-i18n="nav.predict">위험도 분석</a>
    <a href="photo-capture.html" class="bottom-nav__item" data-i18n="nav.photo">사진 분석</a>
    <a href="similar-cases.html" class="bottom-nav__item is-active" data-i18n="nav.cases">사례 검색</a>
    <a href="profile.html" class="bottom-nav__item" data-i18n="nav.profile">내 정보</a>
  </nav>

</div>

<script src="../js/common/idb-store.js"></script>
<script src="../js/common/mock-cases.js"></script>
<script src="../js/common/constants.js"></script>
<script src="../js/common/env.js"></script>
<script src="../js/common/hf-dataset.js"></script>
<script src="../js/common/api.js"></script>
<script src="../js/pages/similar-cases.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
