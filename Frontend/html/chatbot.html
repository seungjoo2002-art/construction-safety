<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 안전 어시스턴트 | AI 건설현장 안전관리 시스템</title>

<script src="../js/common/accessibility.js"></script>
<script src="../js/common/user-prefs.js"></script>
<script src="../js/common/i18n/lang-ko.js"></script>
<script src="../js/common/i18n/lang-en.js"></script>
<script src="../js/common/i18n/lang-zh.js"></script>
<script src="../js/common/i18n/lang-vi.js"></script>
<script src="../js/common/i18n/lang-th.js"></script>
<script src="../js/common/i18n/lang-id.js"></script>
<script src="../js/common/i18n/lang-ne.js"></script>
<script src="../js/common/i18n/lang-ja.js"></script>
<script src="../js/common/i18n/status-labels.js"></script>
<script src="../js/common/i18n.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5FE0">
<link rel="apple-touch-icon" href="../../pictures/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/accessibility.css">
</head>
<body>

<div class="app-frame" data-has-nav="true">

  <header class="app-header">
    <a href="dashboard.html" class="back-btn" aria-label="뒤로가기" data-i18n-aria-label="header.aria.back" style="color:#fff;">&#8249;</a>
    <div class="chat-header" style="flex:1; margin-left: 4px;">
      <img src="../../pictures/logo.png" alt="" class="chat-header__avatar">
      <div>
        <div class="app-header__title" data-i18n="chatbot.headerTitle">AI 안전 어시스턴트</div>
        <div class="chat-header__status" data-i18n="chatbot.headerStatus">온라인 · 24시간 운영</div>
      </div>
    </div>
    <span class="app-header__icon-btn" id="reset-chat-btn" aria-label="대화 초기화" data-i18n-aria-label="chatbot.aria.reset">🔄</span>
  </header>

  <div class="app-content" id="chat-scroll-area">
    <div class="chat-date-divider-row">
      <span class="chat-date-divider" id="chat-date">오늘</span>
    </div>
    <div id="chat-messages"></div>
  </div>

  <div class="quick-reply-row" id="quick-reply-row"></div>

  <div class="chat-input-bar">
    <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." data-i18n-placeholder="chatbot.inputPlaceholder" autocomplete="off">
    <button type="button" class="chat-send-btn" id="chat-send-btn" aria-label="전송" data-i18n-aria-label="chatbot.aria.send">➤</button>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav__item" data-i18n="nav.dashboard">대시보드</a>
    <a href="predict-input.html" class="bottom-nav__item" data-i18n="nav.predict">위험도 분석</a>
    <a href="photo-capture.html" class="bottom-nav__item" data-i18n="nav.photo">사진 분석</a>
    <a href="similar-cases.html" class="bottom-nav__item" data-i18n="nav.cases">사례 검색</a>
    <a href="chatbot.html" class="bottom-nav__item is-active" data-i18n="nav.chatbot">AI 챗봇</a>
    <a href="profile.html" class="bottom-nav__item" data-i18n="nav.profile">내 정보</a>
  </nav>

</div>

<script src="../js/common/session-store.js"></script>
<script src="../js/common/constants.js"></script>
<script src="../js/common/weather.js"></script>
<script src="../js/common/mock-cases.js"></script>
<script src="../js/common/env.js"></script>
<script src="../js/common/api.js"></script>
<script src="../js/pages/chatbot.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
